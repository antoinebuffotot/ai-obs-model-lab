<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier IA - Agent</title>
<link rel="stylesheet" href="common.css">
<style>
  /* agent steps */
  .agent { margin: 0 0 22px; border-left: 3px solid var(--accent); padding-left: 16px; }
  .step { margin: 0 0 12px; }
  .step-h { color: var(--muted); font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 4px; }
  .step .stext { font-family: var(--serif); font-size: 1.02rem; line-height: 1.6; overflow-wrap: anywhere; }
  .step.thought .stext { color: var(--muted); font-style: italic; }
  .step.final .stext { font-size: 1.05rem; line-height: 1.65; }
  .tool {
    margin: 6px 0; padding: 8px 12px; border-radius: 6px; font-family: var(--ui);
    background: var(--note); color: var(--note-ink); border: 1px solid var(--note-line); font-size: .85rem;
  }
  .tool .th { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .tool .tn { font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .tool .ta { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .8rem; overflow-wrap: anywhere; }
  .tool .tr { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9.5em; overflow: auto; cursor: pointer; }
  .tool .tr.open { max-height: none; }
  .tool .wait { opacity: .75; }
  .agent .err { color: var(--err); font-family: var(--ui); font-size: .95rem; }
  .sub { margin: 8px 0 4px; padding-left: 12px; border-left: 2px solid var(--note-line); }
  .sub-h { margin: 0 0 4px; font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--note-ink); }
  .sub .step .stext { font-family: var(--ui); font-size: .9rem; line-height: 1.5; }
  .sub .tool { background: var(--panel); color: var(--ink); border-color: var(--line); }
  .agent .warn { color: var(--warn); font-family: var(--ui); font-size: .88rem; margin: 6px 0; }
</style>
</head>
<body>

<header class="top">
  <h1 data-i18n="title">Atelier IA</h1>
  <nav class="pages" aria-label="Pages">
    <a href="/" data-i18n="navChat">Chat</a>
    <a href="/agent.html" aria-current="page" data-i18n="navAgent">Agent</a>
  </nav>
  <div class="status" aria-live="polite">
    <span class="chip" id="st-model"><i class="dot"></i><span></span></span>
    <span class="chip off" id="st-tools"><i class="dot"></i><span></span></span>
    <span class="chip off" id="st-dtctl"><i class="dot"></i><span></span></span>
    <span class="chip off" id="st-otel"><i class="dot"></i><span></span></span>
    <span class="chip off" id="st-oi"><i class="dot"></i><span></span></span>
  </div>
  <div class="lang" id="lang" role="group" aria-label="Language"></div>
</header>

<div class="shell">
  <aside class="kb">
    <div class="tabs" role="tablist" data-i18n-aria="tabsAria" aria-label="">
      <button type="button" role="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="true" data-i18n="tabSettings">Paramètres</button>
      <button type="button" role="tab" id="tab-tools" aria-controls="panel-tools" aria-selected="false" tabindex="-1" data-i18n="tabTools">Outils</button>
      <button type="button" role="tab" id="tab-obs" aria-controls="panel-obs" aria-selected="false" tabindex="-1" data-i18n="tabObs">Observability</button>
    </div>

    <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings">
      <div class="field">
        <label for="s-model" data-i18n="modelLabel">Modèle</label>
        <select id="s-model"></select>
        <div style="display:flex;gap:6px;margin-top:6px">
          <input type="text" id="s-pull" placeholder="llama3.2:3b" spellcheck="false" style="flex:1;min-width:0">
          <button class="btn ghost" id="s-pull-btn" type="button" data-i18n="modelPull">Télécharger</button>
        </div>
        <p class="hint" id="pull-status"></p>
      </div>
      <div class="field">
        <label for="s-temp"><span data-i18n="temp">Température</span> <output id="o-temp"></output></label>
        <input type="range" id="s-temp" min="0" max="2" step="0.05">
        <p class="hint" data-i18n="tempHint"></p>
      </div>
      <div class="field">
        <label for="s-topk">Top K <output id="o-topk"></output></label>
        <input type="range" id="s-topk" min="1" max="100" step="1">
        <p class="hint" data-i18n="topkHint"></p>
      </div>
      <div class="field">
        <label for="s-topp">Top P <output id="o-topp"></output></label>
        <input type="range" id="s-topp" min="0" max="1" step="0.05">
        <p class="hint" data-i18n="toppHint"></p>
      </div>
      <div class="field">
        <label for="s-steps"><span data-i18n="steps">Étapes maximum</span> <output id="o-steps"></output></label>
        <input type="range" id="s-steps" min="1" max="8" step="1">
        <p class="hint" data-i18n="stepsHint"></p>
      </div>
      <div class="field">
        <label for="s-system" data-i18n="system">Instruction de l'agent</label>
        <textarea id="s-system" rows="9" spellcheck="false"></textarea>
        <p class="hint" data-i18n="systemHint"></p>
      </div>
      <button class="btn ghost" id="s-reset" type="button" data-i18n="reset">Rétablir les valeurs par défaut</button>
      <p class="hint" style="margin-top:10px" data-i18n="resetNote"></p>
    </section>

    <section id="panel-tools" role="tabpanel" aria-labelledby="tab-tools" hidden>
      <p class="hint" data-i18n="toolsHint"></p>
      <ul id="tools-list"></ul>
      <h3 class="mcp-h" id="mcp-head"></h3>
      <ul id="mcp-status"></ul>
      <h3 class="mcp-h" id="dt-head"></h3>
      <ul id="dt-status"></ul>
    </section>

    <section id="panel-obs" role="tabpanel" aria-labelledby="tab-obs" hidden>
      <p class="hint" data-i18n="obsHint"></p>
      <p class="hint" id="obs-service"></p>
    </section>
  </aside>

  <main class="codeview" id="codeview" hidden>
    <div class="file" id="code-file">app/telemetry.py</div>
    <pre><code id="code-body"></code></pre>
  </main>

  <main class="chat" id="chatview">
    <div id="notice" class="notice" hidden></div>
    <div id="log" role="log" aria-live="polite">
      <div class="col" id="messages">
        <section id="empty">
          <h2 data-i18n="emptyTitle">Confiez une tâche à l'agent</h2>
          <p data-i18n="emptyText"></p>
          <div class="starters">
            <button type="button" data-i18n="starter1"></button>
            <button type="button" data-i18n="starter2"></button>
            <button type="button" data-i18n="starter3"></button>
          </div>
        </section>
      </div>
    </div>
    <form id="composer" autocomplete="off">
      <div class="col">
        <textarea id="q" rows="2" data-i18n-ph="placeholder" data-i18n-aria="qAria" placeholder="" aria-label=""></textarea>
        <div class="row">
          <span class="hint" style="margin:0" id="run-hint"></span>
          <button class="btn" id="send" type="submit" data-i18n="send">Envoyer</button>
        </div>
      </div>
    </form>
  </main>
</div>

<style>
  #tools-list, #mcp-status, #dt-status { list-style: none; margin: 0; padding: 0; }
  .mcp-h { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
  #mcp-status li, #dt-status li { padding: 5px 0; font-size: .85rem; overflow-wrap: anywhere; }
  #mcp-status li.ko, #dt-status li.ko { color: var(--err); }
  #mcp-status li.ok::before, #dt-status li.ok::before { content: "● "; color: var(--ok); }
  #tools-list .src { font-size: .72rem; color: var(--note-ink); background: var(--note); border: 1px solid var(--note-line); border-radius: 4px; padding: 0 5px; margin-left: 6px; font-family: var(--ui); font-weight: 600; }
  #tools-list li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .86rem; }
  #tools-list .n { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; display: block; }
  #tools-list .d { color: var(--muted); }
</style>

<script src="common.js"></script>

const FIELDS = [["temperature", "s-temp", "o-temp", 2], ["top_k", "s-topk", "o-topk", 0], ["top_p", "s-topp", "o-topp", 2], ["max_steps", "s-steps", "o-steps", 0]];

/* ---------- model selector: models installed in Ollama, download of a new one ---------- */
const MODELS_API = API, SHOW_TOOLS = true;
let modelList = null;
function paintModels() {

}

$("s-pull-btn").onclick = async () => {
  const name = $("s-pull").value.trim(), out = $("pull-status");

  $("s-pull-btn").disabled = true;
  try {
    const res = await fetch(MODELS_API + "/api/models/pull", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (block.match(/^event: (.*)$/m) || [])[1], data = JSON.parse((block.match(/^data: (.*)$/m) || [, "{}"])[1]);

        else if (ev === "error") throw new Error(data.text);
        else if (ev === "done") out.textContent = t("modelDone", { name });
      }
    }
    await loadModels();
  } catch (e) { out.textContent = t("modelErr", { error: e.message }); }

/* the result paragraph of a card (a direct child: the card of ask_dynatrace also contains the sub-agent's cards) */
const cardResult = (card) => Array.from(card.children).find((el) => el.classList.contains("tr"));

  run.innerHTML = '<div class="steps"></div>' + '<p class="thinking"></p><p class="meta"></p>';

/* One state per run. Events come from the API ("agent" is "main" or "dynatrace"); the same handler replays the

function newRunState(run) {
  return { run, steps: run.querySelector(".steps"), main: { step: null, card: null },
    sub: { step: null, card: null, box: null }, final: null };
}
function handleEvent(st, ev, j) {
  const isSub = j.agent === "dynatrace", who = isSub ? st.sub : st.main;
  if (ev === "step") {
    if (isSub) {
      if (!st.sub.box && st.main.card) {
        const box = document.createElement("div"); box.className = "sub";
        box.innerHTML = '<p class="sub-h"></p>'; box.querySelector(".sub-h").textContent = t("subAgent");
        st.main.card.insertBefore(box, cardResult(st.main.card)); st.sub.box = box;
      }
      who.step = newStep(st.sub.box || st.steps, j.n);
    } else {
      who.step = newStep(st.steps, j.n); st.sub = { step: null, card: null, box: null };
    }
  }
  else if (ev === "token" && who.step) { who.step.text += j.text; who.step.querySelector(".stext").innerHTML = md(who.step.text); }
  else if (ev === "tool_call" && who.step) { who.step.classList.add("thought"); who.card = newToolCard(who.step, j.name, j.args); }
  else if (ev === "tool_result" && who.card) { const r = cardResult(who.card); r.classList.remove("wait"); r.textContent = j.result; }
  else if (ev === "warning") {
    const p = document.createElement("p"); p.className = "warn";
    p.textContent = j.code === "length" ? t("warnLength", { ctx: j.ctx }) : t("warnContext", { tokens: j.tokens, ctx: j.ctx });
    st.steps.append(p);
  }
  else if (ev === "error") { const p = document.createElement("p"); p.className = "err"; p.textContent = j.text; st.steps.append(p); }

/* the last main step without tool call is the answer */
function finalizeRun(st) {
  const steps = Array.from(st.steps.children).filter((el) => el.classList.contains("step"));
  const last = steps[steps.length - 1];
  if (last && !last.querySelector(".tool")) { last.classList.add("final"); return last.text; }
  return "";
}
const metaText = (m) => t("metaDone", { steps: m.steps, n: m.tokens, total: m.total_s,
  t: i18n.num(m.temperature, 2), k: m.top_k, p: i18n.num(m.top_p, 2) });

function renderTurn(turn) {
  addUser(turn.task);
  const run = makeRun();
  run.querySelector(".thinking").remove();
  const st = newRunState(run);
  for (const [ev, j] of turn.events) handleEvent(st, ev, j);
  finalizeRun(st);
  if (turn.meta) run.querySelector(".meta").textContent = metaText(turn.meta);
  messages.append(run);
}
function restoreTurns() {
  if (!turns.length) return;
  const empty = $("empty"); if (empty) empty.remove();
  turns.forEach(renderTurn);
}

  run.querySelector(".thinking").textContent = t("running");
  messages.append(run); scrollDown();
  const thinking = run.querySelector(".thinking"), meta = run.querySelector(".meta");
  const used = { ...settings };
  let finalText = "", errored = false;
  // events are kept (consecutive tokens merged) so the run can be replayed when the page is reopened
  const record = (ev, j) => {
    const last = saved[saved.length - 1];
    if (ev === "token" && last && last[0] === "token" && last[1].agent === j.agent) last[1].text += j.text;
    else saved.push([ev, { ...j }]);

  try {
    const res = await fetch(API + "/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },

        temperature: used.temperature, top_k: used.top_k, top_p: used.top_p,

    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        let ev = "message", data = "";
        for (const line of raw.split("\n")) { if (line.startsWith("event:")) ev = line.slice(6).trim(); else if (line.startsWith("data:")) data += line.slice(5).trim(); }
        if (!data) continue;
        const j = JSON.parse(data);
        if (ev === "error") errored = true;
        record(ev, j); handleEvent(st, ev, j); scrollDown();
      }
    }
    finalText = finalizeRun(st);
    if (st.final) meta.textContent = metaText({ ...st.final, temperature: used.temperature, top_k: used.top_k, top_p: used.top_p });
    if (!finalText && !errored) { const p = document.createElement("p"); p.textContent = t("nothing"); st.steps.append(p); }
  } catch (err) {
    errored = true;
    const p = document.createElement("p"); p.className = "err"; p.textContent = err.message; st.steps.append(p);
  }
  thinking.remove();
  if (!errored && finalText) {
    history.push({ role: "user", content: task }, { role: "assistant", content: finalText });
    turns.push({ task, answer: finalText, events: saved,
      meta: st.final && { steps: st.final.steps, tokens: st.final.tokens, total_s: st.final.total_s,
        temperature: used.temperature, top_k: used.top_k, top_p: used.top_p } });
    saveTurns();
  }
  busy = false; updateSend(); qEl.focus();
}

$("composer").addEventListener("submit", (e) => { e.preventDefault(); const q = qEl.value; qEl.value = ""; ask(q); });
qEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } });
document.querySelectorAll(".starters button").forEach((b) => b.addEventListener("click", () => ask(b.textContent)));

/* ---------- language ---------- */
i18n.switcher("lang", () => { renderStatus(); renderMcp(); syncPrompt(); paintSettings(); document.querySelectorAll(".thinking").forEach((el) => { el.textContent = t("running"); }); });
restoreTurns();
i18n.apply(); renderStatus(); paintSettings();
refreshHealth();
setInterval(refreshHealth, 5000);
</script>
</body>
